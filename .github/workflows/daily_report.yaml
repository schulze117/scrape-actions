name: Daily Pipeline Report

on:
  schedule:
    - cron: '0 15 * * *'  # 17:00 CEST / 16:00 CET
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          echo "EMAIL__SMTP_HOST=${{ secrets.EMAIL__SMTP_HOST }}" >> .env
          echo "EMAIL__SMTP_PORT=${{ secrets.EMAIL__SMTP_PORT }}" >> .env
          echo "EMAIL__USER=${{ secrets.EMAIL__USER }}" >> .env
          echo "EMAIL__PASSWORD=${{ secrets.EMAIL__PASSWORD }}" >> .env
          echo "EMAIL__TO=${{ secrets.EMAIL__TO }}" >> .env

      - name: Send daily report
        run: python -m lib.daily
