name: Run Immowelt Scraper

on:
  schedule:
     - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      retry_count:
        description: 'Bot detection retry attempt'
        required: false
        default: '0'

permissions:
  contents: read
  actions: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          echo "PROXY_URL__IMMOWELT=${{ secrets.PROXY_URL__IMMOWELT }}" >> .env

      - name: Create Service Account JSON
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > immofinder-438008-411bf1440a6c.json

      - name: Run Immowelt Scraper
        id: run
        continue-on-error: true
        run: |
          set +e
          python -m scrape.immowelt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Retry on bot detection
        if: steps.run.outputs.exit_code == '42'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RETRY="${{ inputs.retry_count }}"
          RETRY=${RETRY:-0}
          MAX=15
          if [ "$RETRY" -lt "$MAX" ]; then
            echo "Bot detected (attempt $((RETRY+1))/$MAX). Dispatching retry with new IP..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/immowelt_scrape.yaml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"retry_count\":\"$((RETRY+1))\"}}")
            echo "API response: $STATUS"
            [ "$STATUS" = "204" ] || exit 1
          else
            echo "Max retries ($MAX) reached."
            exit 1
          fi

      - name: Fail on non-bot errors
        if: steps.run.outcome == 'failure' && steps.run.outputs.exit_code != '42'
        run: exit 1
