name: Run Immoscout Finder

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      use_proxy:
        description: 'Route through the AI-server proxy over Tailscale (set false to force a direct, unproxied run)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# One finder at a time (guards against a slow run overlapping the schedule).
concurrency:
  group: immoscout-find
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Empty on scheduled runs -> resolve_proxy() falls back to
    # config.find.immoscout.use_proxy (true) -> proxy on. A manual dispatch with
    # use_proxy=false forces a direct run (only useful for A/B testing the WAF).
    env:
      USE_PROXY: ${{ inputs.use_proxy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Immoscout is fetched through the AI server (residential IP) to clear the
      # AWS WAF. The runner joins the tailnet and reaches the proxy privately at
      # 100.88.231.47:8888 (= PROXY_URL). The node is ephemeral, so it removes
      # itself when the job ends — nothing accumulates. Skipped only for an
      # explicit direct run.
      - name: Connect to Tailscale
        if: ${{ inputs.use_proxy != 'false' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gha-immoscout-find

      - name: Create config.json
        env:
          CONFIG_JSON_CONTENT: ${{ vars.CONFIG_FILE }}
        run: echo "$CONFIG_JSON_CONTENT" > config.json

      - name: Create .env file
        run: |
          touch .env
          echo "DATABASE__USER=${{ secrets.DATABASE__USER }}" >> .env
          echo "DATABASE__HOST=${{ secrets.DATABASE__HOST }}" >> .env
          echo "DATABASE__NAME=${{ secrets.DATABASE__NAME }}" >> .env
          echo "DATABASE__PASSWORD=${{ secrets.DATABASE__PASSWORD }}" >> .env
          echo "DATABASE__PORT=${{ secrets.DATABASE__PORT }}" >> .env
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" >> .env

      - name: Run Immoscout Finder
        run: python -m find.immoscout
